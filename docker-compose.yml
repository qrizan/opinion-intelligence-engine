version: '3.8'

services:
  app:
    build:
      context: .
      args:
        - SENTIMENT_FOLDER_ID=${SENTIMENT_FOLDER_ID}
        - SUMMARIZATION_FOLDER_ID=${SUMMARIZATION_FOLDER_ID}
    container_name: opinion-intelligence-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

